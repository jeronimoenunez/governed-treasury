# Foundry convive con Hardhat: compila los mismos contratos de contracts/
# y corre los tests de fuzzing e invariantes de test-foundry/.
[profile.default]
src = "contracts"
test = "test-foundry"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false
